<section class="section" id="printer_info">
  <header><h2>Impressora</h2></header>
  <label for="paper_size"
    >Tamanho do papel:
    <select name="paper_size" id="paper_size" class="inline"></select
  ></label>
  <div class="ml-2 input-group">
    <label for="paper_size_unit"
      >Unidade exibida na seleção de papel:
      <select name="paper_size_unit" id="paper_size_unit" class="inline">
        <option label="Pontos" value="pt" />
        <option label="Polegadas" value="in" />
        <option label="Centímetros" value="cm" />
      </select>
    </label>
    <label for="paper_size_unit" class="mb-1"
      >Dimensões para PERSONALIZADO:
      <input
        type="number"
        id="paper_size_custom_width"
        name="paper_size_custom_width"
        class="inline"
      />
      x
      <input
        type="number"
        id="paper_size_custom_height"
        name="paper_size_custom_height"
        class="inline"
      />
      (em pontos)
      <span
        data-balloon-length="medium"
        aria-label="A opção PERSONALIZADO só aparece na lista se dimensões válidas forem informadas. Pontos são a unidade com que o sistema trabalha. Felizmente o Google converte cm ou polegadas em pontos facilmente!"
        data-balloon-pos="up"
        >ℹ️</span
      >
    </label>
  </div>

  <label for="printer_type"
    >Tipo de impressora:
    <select name="printer_type" id="printer_type" class="inline">
      <option value="single" selected>Frente única</option>
      <option value="duplex">Frente e verso (duplex)</option>
    </select>
    <span
      data-balloon-length="medium"
      aria-label="Frente e verso alterna frentes e versos das folhas em um único arquivo; Frente única separa frentes e versos em arquivos diferentes."
      data-balloon-pos="up"
      >ℹ️</span
    ></label
  >
  <label for="paper_rotation_90"
    >Girar papel 90°: <input type="checkbox" name="paper_rotation_90" id="paper_rotation_90" />
    <span
      data-balloon-length="medium"
      aria-label="Coloca o papel em 'paisagem' -- o layout continua o mesmo, mas as proporções ficam diferentes"
      data-balloon-pos="up"
      >ℹ️</span
    ></label
  >

  <label class="mb-1"
    >Alternar rotação das páginas (virar pela borda longa):<input
      type="checkbox"
      name="rotate_page"
  /></label>
</section>
