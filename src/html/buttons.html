<div class="flex space-between align-center pb-2">
  <button
    type="button"
    name="preview"
    id="preview"
    disabled
    data-balloon-length="medium"
    aria-label="A pré-visualização não é exibida se 'Somente arquivos por caderno' estiver selecionado. Mostra apenas um lado na impressão 'Frente única'. Não testado em todos os navegadores (na verdade, em nenhum além do Chrome...)"
    data-balloon-pos="right"
    class="small p-1"
  >
    Pré-visualizar PDF
  </button>
  <button type="button" class="larger p-1" name="generate" id="generate" disabled>Gerar PDF</button>
  <button
    type="reset"
    name="reset_settings"
    id="reset_settings"
    data-balloon-length="medium"
    aria-label="A página salva e carrega suas configurações atuais pela URL do site. Clicar neste botão as redefine para os valores padrão"
    data-balloon-pos="left"
    class="small p-1"
  >
    Redefinir configurações
  </button>
</div>
