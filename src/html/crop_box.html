<section class="section">
  <h2>Marcações no PDF</h2>
  <label
    >Adicionar linhas de dobra:
    <input type="checkbox" name="cropmarks" />
    <span
      data-balloon-length="medium"
      aria-label="Adiciona guias de dobra (ordenadas da mais grossa para a mais fina)"
      data-balloon-pos="up"
      >ℹ️
    </span>
  </label>
  <label
    >Adicionar linhas de corte: <input type="checkbox" name="cutmarks" />
    <span data-balloon-length="medium" aria-label="Adiciona guias de corte" data-balloon-pos="up">
      ℹ️</span
    >
  </label>
  <label
    >Adicionar indicadores dos limites do PDF (lombada):
    <input type="checkbox" name="pdf_edge_marks" />
    <span
      data-balloon-length="medium"
      aria-label="Coloca pequenas marcas no fólio mais externo dos cadernos indicando o topo e a base do PDF"
      data-balloon-pos="up"
    >
      ℹ️</span
    >
  </label>
  <label
    >Adicionar marcas de ordem dos cadernos (lombada):
    <input type="checkbox" name="sig_order_marks" />
    <span
      data-balloon-length="medium"
      aria-label="Coloca linhas escalonadas nas lombadas dos cadernos para indicar a ordem"
      data-balloon-pos="up"
      >ℹ️</span
    >
  </label>
  <label class="mb-1"
    >Adicionar marcas de costura:
    <input type="checkbox" id="add_sewing_marks_checkbox" name="add_sewing_marks_checkbox"
  /></label>

  <details id="sewing_marks_details">
    <summary>Configurações detalhadas de costura</summary>
    <label
      >Desenhar marcas em:
      <select name="sewing_mark_locations" id="sewing_mark_locations" class="inline">
        <option value="all" selected="selected">centro de cada fólio</option>
        <option value="only_out">somente na lombada</option>
        <option value="only_in">somente no centro do caderno</option>
        <option value="in_n_out">na lombada e no centro do caderno</option>
      </select>
    </label>
    Veja a imagem abaixo.<br />
    <div class="input-group ml-2">
      <label
        >(A) Margem (distância onde o primeiro ponto deve ser desenhado):
        <input
          type="number"
          id="sewing_marks_margin_pt"
          name="sewing_marks_margin_pt"
          class="layout_margin_user_input_field inline"
        />pt</label
      >

      <label
        >(B) Quantidade de pontos de costura:
        <input
          type="number"
          id="sewing_marks_amount"
          name="sewing_marks_amount"
          class="layout_margin_user_input_field inline"
      /></label>

      <label
        >(C) Largura da fita:
        <input
          type="number"
          id="sewing_marks_tape_width_pt"
          name="sewing_marks_tape_width_pt"
          class="layout_margin_user_input_field inline"
        />pt</label
      >
    </div>
    <img
      alt="imagem de costura - use largura de fita 0pt para fazer um único ponto (marcas sobrepostas)"
      src="/img/sewing_settings_explanation.png"
      style="height: 100%; width: 100%; object-fit: contain"
    />
  </details>
</section>
